<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="style/style.css" />

    <title>Jornada Viagens</title>
  </head>
  <body>
    <header>
      <a href="index.html" title="Voltar Para Página Inicial">
        <picture>
          <source
            media="(min-width:768px)"
            srcset="assets/icon/Logo-provisória-branca-descktop-.png"
          />
          <img
            src="assets/icon/Logo-provisória-branca-celular-tablet.png"
            alt="logo_da_jornada_viagens_com_uma_busula"
          />
        </picture>
      </a>
      <div>
        <label for="menu_hamburguer">
          <img
            class="hamburguer"
            src="assets/icon/icone_menu_branco.png"
            alt="icone_de_menu_hamburguer"
          />
        </label>
        <input id="menu_hamburguer" type="checkbox" hidden />
        <nav class="menu">
          <ul>
            <li>
              <a clas="menu_link" href="blog.html" title="Acessar Blog">Blog</a>
            </li>
            <li>
              <a
                clas="menu_link"
                href="destino.html"
                title="Acessar Pagotes de Viagem"
                >Pacotes de viagem</a
              >
            </li>
            <li>
              <a clas="menu_link" href="contato.html" title="Acessar Contatos"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main></main>
    <footer class="footer-all">
      <div class="footer-main">
        <img
          class="logo-footer"
          src="assets/icon/Logo-footer.png"
          alt="logo da 'jornada viagens'"
        />
        <h4 class="h4-1">
          Horário de atendimento: 08h - 20h (Segunda a Sábado)
        </h4>
        <h4 class="h4-2">
          Desenvolvido por Alura. Projeto fictício sem fins comerciais.
        </h4>
      </div>
      <div>
        <p>Acesse nossas redes:</p>
        <div class="div-icone">
          <a
            href="#"
            target="_blank"
            title="Acesse o whatsapp do Jornada Viagens"
            ><img
              src="assets/icon/icon-whatsapp.png"
              alt="icone do aplicativo whatsapp"
          /></a>
          <a
            href="#"
            target="_blank"
            title="Acesse o Instagram do Jornada Viagens"
            ><img
              src="assets/icon/icon-instragam.png"
              alt="icone do aplicativo instagram"
          /></a>
          <a href="#" target="_blank" title="Acesse o Twiter do Jornada Viagens"
            ><img
              src="assets/icon/icon-twiter.png"
              alt="icone do aplicativo twiter"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
