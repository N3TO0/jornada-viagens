<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style/reset.css" />

    <title>Jornada Viagens</title>

  <body>
    <header>
      <a href="index.html" title="Voltar Para Página Inicial">
        <picture>
          <source
            media="(min-width:768px)"
            srcset="assets/img/Logo-provisória-branca-descktop-.png"
          />
          <img
            src="assets/img/Logo-provisória-branca-celular-tablet.png"
            alt="logo_da_jornada_viagens_com_uma_busula"
          />
        </picture>
      </a>
      <div>
        <label for="menu_hamburguer">
          <img
            class="hamburguer"
            src="assets/img/icone_menu_branco.png"
            alt="icone_de_menu_hamburguer"

        </label>
        <input id="menu_hamburguer" type="checkbox" hidden />
        <nav class="menu">
          <ul>
            <li>
              <a clas="menu_link" href="blog.html" title="Acessar Blog">Blog</a>
            </li>
            <li>
              <a
                clas="menu_link"
                href="destino.html"
                title="Acessar Pagotes de Viagem"

              >
            </li>
            <li>
              <a clas="menu_link" href="contato.html" title="Acessar Contatos"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="hero-img"></div>
        <div class="content-hero">
          <h4>Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino à seleção das atividades, cuidamos de todos os detalhes para que você aproveite ao máximo cada momento da sua jornada!</h2>

    <footer></footer>
